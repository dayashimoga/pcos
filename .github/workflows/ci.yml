name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.24.0"

jobs:
  # ─── Backend Checks ──────────────────────────────────────
  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcos
          POSTGRES_PASSWORD: pcos_secret
          POSTGRES_DB: pcos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run tests
        run: cargo test --manifest-path backend/Cargo.toml --all
        env:
          PCOS_DATABASE__URL: postgresql://pcos:pcos_secret@localhost:5432/pcos_test
          PCOS_AUTH__JWT_SECRET: ci-test-secret-that-is-long-enough-for-testing-purposes-64-chars!!
          SQLX_OFFLINE: "true"

  backend-security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit --file backend/Cargo.lock

  agent-build:
    name: Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo build --manifest-path agent/Cargo.toml --release
      - run: cargo test --manifest-path agent/Cargo.toml --all

  # ─── Frontend Checks ────────────────────────────────────
  frontend-analyze:
    name: Frontend Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: frontend
        run: |
          flutter pub get
          dart analyze
          dart format --set-exit-if-changed .

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: frontend
        run: |
          flutter pub get
          flutter test --coverage

  # ─── Docker Build ────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-format, backend-lint, backend-test, frontend-analyze, frontend-test, agent-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pcos-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t pcos-frontend:ci ./frontend
      - name: Build agent image
        run: docker build -t pcos-agent:ci ./agent

  # ─── SBOM & License Scan ─────────────────────────────────
  sbom:
    name: SBOM & License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check licenses & advisories
        run: cargo deny --manifest-path backend/Cargo.toml check licenses advisories
        continue-on-error: true

  # ─── Compose Validation ──────────────────────────────────
  compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: docker compose config -q
      - name: Validate dev compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
