name: PCOS Production Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Phase 1: Build & Unit Tests ────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Backend unit tests
        run: cargo test --workspace --no-fail-fast 2>&1 | tee backend_tests.log
        working-directory: backend
        env:
          SQLX_OFFLINE: true

      - name: Agent unit tests
        run: cargo test --no-fail-fast 2>&1 | tee agent_tests.log
        working-directory: agent
        env:
          SQLX_OFFLINE: true

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-logs
          path: |
            backend/backend_tests.log
            agent/agent_tests.log

  # ─── Phase 2: Security Scanning ─────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: License & vulnerability audit
        run: cargo deny check 2>&1 | tee security_scan.log || true
        working-directory: backend

      - name: Secret scanning
        run: |
          echo "Scanning for hardcoded secrets..."
          SECRETS_FOUND=0
          # Check for hardcoded passwords, API keys, tokens
          for pattern in "password\s*=\s*\"[^\"]+\"" "api_key\s*=\s*\"" "secret\s*=\s*\"(?!test|example|change)" "Bearer [a-zA-Z0-9._-]{20,}"; do
            MATCHES=$(grep -rn --include="*.rs" --include="*.dart" --include="*.yml" -P "$pattern" . | grep -v "test" | grep -v "example" | grep -v "fixture" | grep -v ".env" | head -5 || true)
            if [ -n "$MATCHES" ]; then
              echo "  ⚠ Potential secret pattern: $pattern"
              echo "$MATCHES"
              SECRETS_FOUND=$((SECRETS_FOUND + 1))
            fi
          done
          echo "Secrets scan: $SECRETS_FOUND potential issues"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: backend/security_scan.log

  # ─── Phase 3: Docker Build & Integration Tests ──────
  integration:
    name: Integration & API Tests
    runs-on: ubuntu-latest
    needs: [build-and-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcos_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pcos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build backend
        run: cargo build --release
        working-directory: backend
        env:
          SQLX_OFFLINE: true

      - name: Start backend & Run API smoke tests
        run: |
          mkdir -p /tmp/pcos-test-storage

          # Wait for PostgreSQL readiness
          echo "Checking PostgreSQL readiness..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U pcos_test > /dev/null 2>&1 || nc -z localhost 5432 > /dev/null 2>&1; then
              echo "✓ PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
          done

          # Start backend server in background
          nohup ./target/release/pcos-server > /tmp/server.log 2>&1 &

          # Wait for server readiness
          HEALTHY=false
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✓ Backend server is up and healthy"
              HEALTHY=true
              break
            fi
            echo "Waiting for backend server to start ($i/30)..."
            sleep 1
          done

          if [ "$HEALTHY" = "false" ]; then
            echo "❌ Backend server failed to start within 30 seconds"
            echo "=== /tmp/server.log ==="
            cat /tmp/server.log || true
            exit 1
          fi

          # Health check response
          echo "Health check response:"
          curl -s http://localhost:8080/health | jq .

          # Register
          REGISTER=$(curl -s -X POST http://localhost:8080/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@pcos.test","password":"CiP@ss123!","display_name":"CI User"}')
          echo "Register response: $REGISTER"

          TOKEN=$(echo "$REGISTER" | jq -r '.tokens.access_token // .token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Registration returned non-token response, attempting login..."
            LOGIN=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"ci@pcos.test","password":"CiP@ss123!"}')
            echo "Login response: $LOGIN"
            TOKEN=$(echo "$LOGIN" | jq -r '.tokens.access_token // .token // empty')
          fi

          if [ -n "$TOKEN" ]; then
            echo "✓ Authentication successful"
            curl -sf http://localhost:8080/api/v1/files -H "Authorization: Bearer $TOKEN" | jq . || true
            curl -sf http://localhost:8080/api/v1/notifications -H "Authorization: Bearer $TOKEN" | jq . || true
            curl -sf "http://localhost:8080/api/v1/search?q=test" -H "Authorization: Bearer $TOKEN" | jq . || true
            echo "✓ API tests passed"
          else
            echo "✗ Registration and login failed"
            echo "=== Server Output Log ==="
            cat /tmp/server.log
            exit 1
          fi
        working-directory: backend
        env:
          PCOS_SERVER__HOST: "0.0.0.0"
          PCOS_SERVER__PORT: "8080"
          PCOS_DATABASE__URL: "postgresql://pcos_test:test_password@localhost:5432/pcos_test"
          PCOS_AUTH__JWT_SECRET: "ci-test-jwt-secret-minimum-32-characters-long"
          PCOS_REDIS__URL: "redis://localhost:6379"
          PCOS_STORAGE__BASE_PATH: "/tmp/pcos-test-storage"
          RUST_LOG: "pcos=info,sqlx=warn"

  # ─── Phase 4: Docker Compose Validation ─────────────
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Validate test compose
        run: docker compose -f qa/docker-compose.test.yml config --quiet

  # ─── Phase 5: Certification Report ──────────────────
  certification:
    name: Certification Report
    runs-on: ubuntu-latest
    needs: [build-and-test, security, integration, docker-validation]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate certification report
        run: |
          mkdir -p qa/reports/ci
          
          # Determine pass/fail from job results
          BUILD_RESULT="${{ needs.build-and-test.result }}"
          SECURITY_RESULT="${{ needs.security.result }}"
          INTEGRATION_RESULT="${{ needs.integration.result }}"
          DOCKER_RESULT="${{ needs.docker-validation.result }}"
          
          ALL_PASSED="true"
          for r in "$BUILD_RESULT" "$SECURITY_RESULT" "$INTEGRATION_RESULT" "$DOCKER_RESULT"; do
            if [ "$r" != "success" ]; then
              ALL_PASSED="false"
              break
            fi
          done
          
          VERDICT="FAIL"
          [ "$ALL_PASSED" = "true" ] && VERDICT="PASS"
          
          cat > qa/reports/ci/certification.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "0.8.0",
            "verdict": "$VERDICT",
            "ci_run": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "jobs": {
              "build_and_test": "$BUILD_RESULT",
              "security": "$SECURITY_RESULT",
              "integration": "$INTEGRATION_RESULT",
              "docker_validation": "$DOCKER_RESULT"
            },
            "features_registered": $(jq '.features | length' qa/feature_registry.json),
            "quality_gates": $(jq '.quality_gates' qa/feature_registry.json)
          }
          EOF
          
          echo "## PCOS Certification — $VERDICT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Tests | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | $SECURITY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | $INTEGRATION_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | $DOCKER_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Features: $(jq '.features | length' qa/feature_registry.json) registered" >> $GITHUB_STEP_SUMMARY

      - name: Upload certification report
        uses: actions/upload-artifact@v4
        with:
          name: certification-report
          path: qa/reports/ci/

      - name: Fail if not certified
        if: needs.build-and-test.result != 'success' || needs.integration.result != 'success'
        run: |
          echo "❌ Certification FAILED — quality gates not met"
          exit 1
