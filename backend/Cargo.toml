[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/auth",
    "crates/user",
    "crates/device",
    "crates/file_metadata",
    "crates/search",
    "crates/ai",
    "crates/sharing",
    "crates/sync_engine",
    "crates/notification",
    "crates/worker",
    "crates/backup",
    "crates/analytics",
    "crates/gateway",
    "crates/streaming",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/pcos/pcos"

[workspace.dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "request-id", "util"] }
hyper = { version = "1.0", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
getrandom = "=0.2.16"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
async-trait = "0.1"

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Rate limiting
governor = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
